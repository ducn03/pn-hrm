# 200 - Success
200=success
20010001=User finance profile updated successfully
20011001=Labor contract created successfully
20011002=Labor contract updated successfully
20012001=Candidate application received successfully
20012002=Candidate profile updated successfully
20012003=Candidate converted to employee successfully

# 400 - Common & Validation
40000001=Invalid request
40000002=Failed to record activity log
40002001=Invalid input data
40002004=Full name is required
40002007=Invalid email format
40002009=Invalid status

# 401 - Unauthorized
40100001=Session expired, please login again
40100002=Authentication required
40100003=Invalid authentication token

# 403 - Forbidden
40300001=Access denied for this resource
40300002=Role not allowed

# 404 - Not Found
40400001=Requested resource not found

# 500 - Server Error
50000001=Internal server error occurred

# 40010xxx - HRM Finance Errors
40010001=User finance profile not found
40010002=Invalid bank account number
40010003=Bank not found in catalog

# 40011xxx - HRM Contract Errors
40011001=Labor contract not found
40011002=Contract number already exists
40011003=Contract end date must be after start date
40011004=Invalid labor contract type

# 40012xxx - HRM Candidate & Recruitment Errors
40012001=Candidate profile not found
40012002=Candidate is already converted to an employee
40012003=Invalid phone number format
40012004=Invalid recruitment stage
