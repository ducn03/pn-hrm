server:
  port: ${SERVER_PORT:9002}

spring:
  application:
    name: pn-hrm

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/premiernutserp}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 15
      minimum-idle: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Premier Nuts JWT Configuration for Token Verification
pn:
  jwt:
    secret-key: ${JWT_SECRET_KEY:PremierNutsSecretKeyForJWTAuth2026SecureKeyWithAtLeast256BitsLong!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
